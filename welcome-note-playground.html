<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome Note Playground</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      display: grid;
      grid-template-columns: 400px 1fr;
      grid-template-rows: 1fr auto;
      height: 100vh;
      gap: 1px;
      background: #2a2a2a;
    }

    .controls {
      background: #1e1e1e;
      padding: 24px;
      overflow-y: auto;
      grid-row: 1 / 3;
    }

    .preview-area {
      background: #252525;
      padding: 48px;
      overflow-y: auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .prompt-area {
      background: #1a1a1a;
      padding: 20px 24px;
      border-top: 1px solid #333;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #fff;
    }

    .control-group {
      margin-bottom: 24px;
    }

    .control-group label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      color: #e0e0e0;
      font-family: inherit;
      font-size: 14px;
      padding: 12px;
      resize: vertical;
      line-height: 1.6;
    }

    textarea:focus {
      outline: none;
      border-color: #4a9eff;
    }

    .preset-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
    }

    .preset-btn {
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      color: #e0e0e0;
      padding: 8px 16px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .preset-btn:hover {
      background: #333;
      border-color: #4a9eff;
    }

    /* Note card preview */
    .note-card {
      background: #fff;
      border-radius: 8px;
      padding: 32px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
      color: #1a1a1a;
    }

    .note-title {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #1a1a1a;
      line-height: 1.3;
    }

    .note-body {
      font-size: 16px;
      line-height: 1.7;
      color: #333;
      white-space: pre-wrap;
    }

    .note-body p {
      margin-bottom: 16px;
    }

    .note-body p:last-child {
      margin-bottom: 0;
    }

    .note-body strong {
      font-weight: 600;
      color: #1a1a1a;
    }

    .note-body em {
      font-style: italic;
    }

    .prompt-output {
      font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.6;
      color: #b0b0b0;
      white-space: pre-wrap;
    }

    .copy-btn {
      align-self: flex-start;
      background: #4a9eff;
      border: none;
      border-radius: 6px;
      color: #fff;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .copy-btn:hover {
      background: #3a8eef;
    }

    .copy-btn.copied {
      background: #4caf50;
    }

    .char-count {
      font-size: 11px;
      color: #666;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="controls">
      <h1>Welcome Note Editor</h1>

      <div class="preset-buttons">
        <button class="preset-btn" onclick="loadPreset('friendly')">Friendly</button>
        <button class="preset-btn" onclick="loadPreset('minimal')">Minimal</button>
        <button class="preset-btn" onclick="loadPreset('instructional')">Instructional</button>
        <button class="preset-btn" onclick="loadPreset('complete')">Complete Guide</button>
        <button class="preset-btn" onclick="loadPreset('inspiring')">Inspiring</button>
      </div>

      <div class="control-group">
        <label>Title</label>
        <textarea id="title" rows="2" oninput="updateAll()"></textarea>
        <div class="char-count" id="title-count"></div>
      </div>

      <div class="control-group">
        <label>Body Text</label>
        <textarea id="body" rows="12" oninput="updateAll()"></textarea>
        <div class="char-count" id="body-count"></div>
      </div>

      <div class="control-group">
        <label>Closing / Call to Action</label>
        <textarea id="closing" rows="3" oninput="updateAll()"></textarea>
        <div class="char-count" id="closing-count"></div>
      </div>
    </div>

    <div class="preview-area">
      <div class="note-card">
        <div class="note-title" id="preview-title"></div>
        <div class="note-body" id="preview-body"></div>
      </div>
    </div>

    <div class="prompt-area">
      <div class="prompt-output" id="prompt"></div>
      <button class="copy-btn" id="copy-btn" onclick="copyPrompt()">Copy Prompt</button>
    </div>
  </div>

  <script>
    const state = {
      title: '',
      body: '',
      closing: ''
    };

    const PRESETS = {
      friendly: {
        title: 'Welcome to Canvassy',
        body: `This is your canvas. A place to think, write, and connect ideas freely.

Create cards to capture your thoughts. Arrange them spatially. Draw arrows to show relationships. Zoom out to see the big picture, or zoom in to focus on a single idea.

There's no right way to use this space—start wherever feels natural.`,
        closing: 'Click anywhere to create your first card.'
      },
      minimal: {
        title: 'Start here',
        body: `Click anywhere to add a card.
Drag to arrange.
Connect with arrows.`,
        closing: ''
      },
      instructional: {
        title: 'Welcome to Canvassy',
        body: `Canvassy is a spatial thinking tool that bridges two worlds: the messy, exploratory phase where ideas are still forming, and the focused, deep phase where you actually write.

Here's how it works:

Creating & Moving Cards
• Double-click anywhere on the canvas to create a new card
• Drag cards by their header bar to arrange them freely
• Delete a card by clicking the 🗑 button twice (safety feature)

Writing
• Click a card's body to edit inline (quick edits)
• Click the ✏️ button for full-screen editor (deep writing)
• Each card has a 500-word limit to encourage focused thinking
• Add a summary at the bottom of each card

Connecting Ideas
• Hover over a card to see connection handles (circles at edges)
• Drag from one handle to another to draw an arrow
• Click an arrow to customize its style and direction
• Double-click an arrow to add a label

Zooming
• Zoom out to see the big picture—cards collapse to show only summaries
• Zoom in to read full content and write
• Use the minimap (bottom-right) to navigate quickly

Everything saves automatically.`,
        closing: 'Ready? Double-click anywhere to create your first card.'
      },
      inspiring: {
        title: 'Your thinking space',
        body: `Great ideas rarely arrive in perfect order. They emerge through exploration—connecting dots, rearranging fragments, discovering patterns you didn't know were there.

Canvassy gives you space to think the way your mind actually works: spatially, associatively, iteratively.

Start messy. The structure will reveal itself.`,
        closing: 'Click anywhere to begin.'
      },
      complete: {
        title: 'Welcome to Canvassy',
        body: `Writing and thinking are non-linear processes, but most note-taking apps force you into linear structures. Canvassy is different—it's built for how your mind actually works.

This is a spatial canvas where you can:
• Capture thoughts in cards and arrange them freely
• Draw connections to map relationships between ideas
• Zoom out to see patterns, zoom in to focus and write
• Move seamlessly between exploring and deep writing

How to use Canvassy:

Creating Cards
Double-click anywhere on the canvas to create a new card at that position.

Writing
Click a card's body to edit inline, or click the ✏️ button in the header for a distraction-free full-screen editor. Each card holds up to 500 words—enough for a focused thought, not an essay.

Adding Summaries
Every card has a summary field at the bottom. Write a short version of your idea here. When you zoom out past 60%, cards collapse to show only summaries—perfect for seeing the shape of your thinking.

Connecting Ideas
Hover over a card to reveal connection handles (small circles at the edges). Drag from one handle to another card's handle to draw an arrow. Click the arrow to change its style (solid, dashed, dotted) or direction. Double-click to add a label.

Navigating
Use your trackpad or mouse wheel to pan and zoom. The minimap in the bottom-right corner shows where everything is. Zoom controls are in the bottom-left.

Deleting
Click the 🗑 button in a card's header, then click again within 3 seconds to confirm deletion.

Your canvas saves automatically. There's no wrong way to start—just double-click and begin.`,
        closing: ''
      }
    };

    function loadPreset(name) {
      const preset = PRESETS[name];
      state.title = preset.title;
      state.body = preset.body;
      state.closing = preset.closing;

      document.getElementById('title').value = state.title;
      document.getElementById('body').value = state.body;
      document.getElementById('closing').value = state.closing;

      updateAll();
    }

    function updateAll() {
      // Get values
      state.title = document.getElementById('title').value;
      state.body = document.getElementById('body').value;
      state.closing = document.getElementById('closing').value;

      // Update character counts
      document.getElementById('title-count').textContent = `${state.title.length} characters`;
      document.getElementById('body-count').textContent = `${state.body.length} characters`;
      document.getElementById('closing-count').textContent = `${state.closing.length} characters`;

      // Render preview
      renderPreview();

      // Update prompt
      updatePrompt();
    }

    function renderPreview() {
      const titleEl = document.getElementById('preview-title');
      const bodyEl = document.getElementById('preview-body');

      titleEl.textContent = state.title || 'Welcome';

      // Combine body and closing
      const fullBody = state.closing
        ? `${state.body}\n\n${state.closing}`
        : state.body;

      // Convert paragraphs
      const paragraphs = fullBody.split('\n\n').filter(p => p.trim());
      bodyEl.innerHTML = paragraphs.map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');
    }

    function updatePrompt() {
      const promptEl = document.getElementById('prompt');

      let prompt = 'Update the welcome note with the following content:\n\n';

      if (state.title) {
        prompt += `Title: "${state.title}"\n\n`;
      }

      if (state.body) {
        prompt += `Body:\n${state.body}\n\n`;
      }

      if (state.closing) {
        prompt += `Closing: ${state.closing}`;
      }

      promptEl.textContent = prompt.trim();
    }

    function copyPrompt() {
      const promptText = document.getElementById('prompt').textContent;
      const btn = document.getElementById('copy-btn');

      navigator.clipboard.writeText(promptText).then(() => {
        btn.textContent = 'Copied!';
        btn.classList.add('copied');

        setTimeout(() => {
          btn.textContent = 'Copy Prompt';
          btn.classList.remove('copied');
        }, 2000);
      });
    }

    // Initialize with complete guide preset
    loadPreset('complete');
  </script>
</body>
</html>
